[package]
name = "youtube-gif-maker"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full", "macros", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
tower-http = { version = "0.7.1", features = ["cors", "set-header"] }
include_dir = "0.7.4"
mime_guess = "2.0.5"

# rustls-platform-verifier needs JNI initialisation on Android; use bundled roots there instead.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
