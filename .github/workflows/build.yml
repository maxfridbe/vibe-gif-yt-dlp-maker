name: Release Builds

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os-name: linux
          - platform: macos-latest
            os-name: macos
          - platform: windows-latest
            os-name: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"

      - name: add cargo bin to PATH (Unix)
        if: matrix.os-name != 'windows'
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: add cargo bin to PATH (Windows)
        if: matrix.os-name == 'windows'
        run: echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH

      - name: build app
        run: cargo tauri build

      - name: Upload Linux artifacts
        if: matrix.os-name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-gif-maker-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload macOS artifacts
        if: matrix.os-name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-gif-maker-macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows artifacts
        if: matrix.os-name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-gif-maker-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: install Android NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV
          
      - name: install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          
      - name: install cargo-tauri
        run: |
          cargo install tauri-cli --version "^2.0.0"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
      - name: build android APK
        run: cargo tauri android build --apk
        
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-gif-maker-android-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  publish-release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: youtube-gif-maker-linux
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: youtube-gif-maker-macos
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: youtube-gif-maker-windows
          path: artifacts/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: youtube-gif-maker-android-apk
          path: artifacts/android

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "YouTube GIF Maker v1.0.0"
          body: "Release v1.0.0 — YouTube GIF Maker cross-platform builds for Linux, macOS, Windows, and Android."
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
